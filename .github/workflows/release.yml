name: Prepare signed release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved version tag, for example v0.1.0
        required: true
        type: string
      sha:
        description: Reviewed full commit SHA for that tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macsweep-release
  cancel-in-progress: false

jobs:
  prepare:
    # Use only a dedicated trusted release Mac. Never run PR code on this runner.
    runs-on: [self-hosted, macOS, macsweep-release]
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
      - name: Recheck tag and main against the remote
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Checkout fetched the authenticated refs; the script checks their identity.
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Build, sign, notarize, staple, and verify
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
          MACSWEEP_RELEASE_READY: ${{ vars.MACSWEEP_RELEASE_READY }}
          MACSWEEP_SIGNING_IDENTITY: ${{ vars.MACSWEEP_SIGNING_IDENTITY }}
          MACSWEEP_NOTARY_PROFILE: ${{ vars.MACSWEEP_NOTARY_PROFILE }}
        run: ./scripts/release/build-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macsweep-signed-${{ inputs.sha }}
          path: |
            build/MacSweep-*.zip
            build/MacSweep-*.dmg
            build/SHA256SUMS
            build/notarization-*.json
            build/signature.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
