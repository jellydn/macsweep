name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
      - run: ./scripts/check.sh
      - name: Check workflow syntax
        if: runner.os == 'Linux'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Cross-build both Mac architectures without cgo
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=darwin GOARCH=arm64 go build -tags mygo_noinspector -o build/macsweep-arm64 ./cmd/macsweep
          GOOS=darwin GOARCH=amd64 go build -tags mygo_noinspector -o build/macsweep-amd64 ./cmd/macsweep

  test-app:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
      - name: Build a development artifact, not a release
        env:
          CGO_ENABLED: '0'
        run: |
          go tool mygo build -platform darwin/universal -skip-dmg -skip-notarize -sign -
          app='build/darwin-universal/MacSweep.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo "$app/Contents/MacOS/MacSweep" -verify_arch arm64 x86_64
          ditto -c -k --sequesterRsrc --keepParent "$app" build/MacSweep-test.zip
          echo 'Setup-only universal app. Ad-hoc signed, not notarized. Cleanup is unavailable.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macsweep-test-${{ github.sha }}
          path: build/MacSweep-test.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
